<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avant de réserver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
  /* DA métro Playlift : mur carrelé, frise verte, le formulaire est une affiche papier */
  :root { --orange:#FF4A1C; --noir:#111114; --jaune:#FF9A1F; --blanc:#F3F3F0; --frise:#1F5C4A;
          --carreau:#ECEBE6; --joint:#D6D4CC; --gris:#5B5B57;
          --sans:"Inter",-apple-system,"SF Pro Display",Arial,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--noir); padding:0 16px 64px;
         font:17px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
         background-color:var(--carreau);
         background-image:linear-gradient(var(--joint) 2px,transparent 2px),linear-gradient(90deg,var(--joint) 2px,transparent 2px);
         background-size:96px 48px; }
  body::before { content:""; display:block; height:34px; margin:0 -16px 44px; background:var(--frise);
         background-image:repeating-linear-gradient(45deg,rgba(243,243,240,.22) 0 3px,transparent 3px 17px),repeating-linear-gradient(-45deg,rgba(243,243,240,.22) 0 3px,transparent 3px 17px);
         border-bottom:4px solid #173F33; }
  main { max-width:660px; margin:0 auto; background:var(--blanc); padding:44px 48px 48px;
         border:14px solid #D8D8D4; outline:2px solid #BDBDB8;
         box-shadow:inset 0 10px 18px rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.28); }
  h1 { font-size:clamp(30px,6vw,46px); font-weight:800; letter-spacing:-.035em; line-height:1.04; margin:0 0 14px; }
  p.chapeau { font-size:19px; font-weight:600; line-height:1.4; margin:0 0 26px; padding-bottom:22px; border-bottom:3px solid var(--noir); }
  label { display:block; margin:24px 0 8px; font-weight:800; font-size:18px; letter-spacing:-.015em; }
  .aide { display:block; font-weight:500; color:var(--gris); font-size:15px; letter-spacing:0; margin-top:2px; }
  input, textarea, select {
    width:100%; margin-top:8px; padding:13px 14px; border:2px solid var(--noir); border-radius:0;
    background:#fff; color:inherit; font:500 16px/1.4 var(--sans); }
  input:focus, textarea:focus, select:focus { outline:3px solid var(--orange); outline-offset:0; }
  textarea { min-height:96px; resize:vertical; }
  button { margin-top:32px; width:100%; padding:18px; border:0; border-radius:0;
           background:var(--orange); color:var(--noir); font:800 19px/1 var(--sans); letter-spacing:-.01em; cursor:pointer; }
  button:hover { background:var(--noir); color:var(--orange); }
  button[disabled] { opacity:.55; cursor:default; }
  #fin { display:none; }
  #fin a { color:var(--noir); font-weight:800; text-decoration:none; border-bottom:3px solid var(--orange); }
  @media (max-width:640px) { main { padding:26px 20px 30px; border-width:8px; } body::before { margin-bottom:28px; } }
</style>
</head>
<body>
<main>
  <div id="formulaire">
    <h1>Avant de réserver un créneau</h1>
    <p class="chapeau">Cinq questions, deux minutes. Elles évitent qu'on passe 45 minutes à découvrir qu'on ne peut pas s'aider.</p>

    <form id="f">
      <label>Ton prénom et ton email
        <input name="Contact" required placeholder="Camille · camille@exemple.fr">
      </label>

      <label>Qu'est-ce que tu vends, et à quel prix ?
        <span class="aide">En une phrase.</span>
        <textarea name="Offre" required></textarea>
      </label>

      <label>Qu'est-ce qui bloque aujourd'hui ?
        <span class="aide">Le plus précis possible. « Je veux plus de clients » ne dit rien.</span>
        <textarea name="Blocage" required></textarea>
      </label>

      <label>Combien ça te coûte, à peu près ?
        <span class="aide">En euros par mois, même approximatif. Si tu ne l'as jamais calculé, écris-le.</span>
        <input name="Cout" required>
      </label>

      <label>Qu'est-ce qui t'empêche d'attendre six mois ?
        <textarea name="Urgence" required></textarea>
      </label>

      <label>Tu décides seul ?
        <select name="Decision" required>
          <option value="">—</option>
          <option>Oui, je décide seul</option>
          <option>Avec un associé</option>
          <option>Je dois en parler à quelqu'un d'autre</option>
        </select>
      </label>

      <button type="submit">Envoyer</button>
    </form>
  </div>

  <div id="fin">
    <h1>C'est envoyé.</h1>
    <p class="chapeau" id="message"></p>
  </div>
</main>

<script>
var CALENDRIER = "{{CALENDRIER}}";
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Un instant…";
  var data = {};
  new FormData(e.target).forEach(function (v, k) { data[k] = v; });

  fetch("/", { method: "POST", headers: { "Content-Type": "application/json" },
               body: JSON.stringify(data) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      document.getElementById("formulaire").style.display = "none";
      document.getElementById("fin").style.display = "block";
      // Un lead écarté ne l'apprend jamais : on ne braque personne, et un tiède
      // d'aujourd'hui peut devenir un client dans trois mois.
      var m = document.getElementById("message");
      if (res.retenu && CALENDRIER && CALENDRIER.indexOf("{{") !== 0) {
        m.innerHTML = 'Choisis ton créneau : <a href="' + CALENDRIER + '">réserver</a>.';
      } else {
        m.textContent = "Je lis ça et je te réponds personnellement sous 24 h.";
      }
    })
    .catch(function () {
      btn.disabled = false; btn.textContent = "Réessayer";
    });
});
</script>
</body>
</html>
